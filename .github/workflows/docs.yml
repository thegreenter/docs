name: Greenter Docs

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -IU -r requirements.txt
        pip install -U ghp-import
        npm install
    - name: Generate SUNAT rules
      run: python scripts/sunat_rules.py
    - name: Build
      run: |
        mkdocs build
        npm run build-sw
    - name: Deploy Mkdocs
      run: |
        git config user.name "Giancarlos Salas"
        git config user.email "giansalex@gmail.com"
        git remote add gh-token "https://${GH_TOKEN}@github.com/thegreenter/docs.git"
        git fetch gh-token && git fetch gh-token gh-pages:gh-pages
        ghp-import --remote=gh-token --message="Deployed MkDocs" --push site 
      env:
        GH_TOKEN: ${{ secrets.ghToken }} 

